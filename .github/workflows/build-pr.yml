name: Build PR
on: [pull_request, workflow_dispatch]
env:
  BUILD_TYPE: Release
jobs:
  build-pr:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false

      - name: Fetch submodules
        shell: bash
        env:
          SUBMODULE_PAT: ${{ secrets.SHARED_PAT }}
        run: |
          if [ -n "$SUBMODULE_PAT" ]; then
            # actions/checkout writes a repo-scoped token into .git/config that git
            # applies to EVERY github.com URL, so it 401s against the private
            # SR-lib and has to come out before our own credentials can take
            # effect. The rewrite must be --global, not --local: `git submodule
            # update` spawns a separate clone process that never reads this repo's
            # local config.
            git config --local --unset-all http.https://github.com/.extraheader || true
            git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf "https://github.com/"
          else
            # No credentials for the private SR-lib (fork, outside PR, or the
            # secret was never set). LeiaSR isn't built here anyway - REF_LEIASR
            # defaults to OFF - so skip that one submodule instead of failing.
            echo "::notice::No SHARED_PAT secret; skipping the private SR-lib submodule (LeiaSR is not built in CI)."
            git config submodule."dependencies/SR-lib".update none
          fi
          git submodule update --init --recursive

      - name: Audit direct struct field access
        run: |
          pip install libclang
          python dev/audit_direct_access_clang.py

      - name: Configure CMake
        run: cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -G "Visual Studio 18 2026" -A x64 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DDEVELOPER_MODE=ON "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target REFramework

      - name: Upload artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: REFramework
          path: ${{github.workspace}}/build/bin/REFramework/dinput8.dll
          if-no-files-found: error
